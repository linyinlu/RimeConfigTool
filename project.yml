name: RimeConfigTool
options:
  bundleIdPrefix: com.linyinlu
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    SWIFT_VERSION: '5.0'
    CODE_SIGN_ENTITLEMENTS: ''
targets:
  RimeConfigTool:
    type: application
    platform: macOS
    sources:
      - path: .
        includes:
          - '*.swift'
          - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linyinlu.RimeConfigTool
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rime 配置工具
        CODE_SIGN_ENTITLEMENTS: ''
