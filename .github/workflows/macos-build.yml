name: macOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: xcodebuild -project RimeConfigTool.xcodeproj -scheme RimeConfigTool -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO build
